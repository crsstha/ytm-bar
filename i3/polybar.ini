; Add to your polybar config, then put "ytm" in modules-right (or left/center).
; A moving wave and the title while playing; dimmed while paused or stopped.
[module/ytm]
type = custom/script
exec = ~/.local/bin/ytm-bar bar --follow
tail = true
click-left = setsid -f ~/.local/bin/ytm-panel
click-right = setsid -f ~/.local/bin/ytm-panel search
click-middle = ~/.local/bin/ytm-bar toggle >/dev/null
scroll-up = ~/.local/bin/ytm-bar previous >/dev/null
scroll-down = ~/.local/bin/ytm-bar next >/dev/null
